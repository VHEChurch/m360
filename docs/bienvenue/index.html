<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bienvenue · Love Expression Assembly</title>
<meta name="description" content="Carte de bienvenue de Love Expression Assembly (Église Vases d'Honneur d'Edmonton).">
<meta name="theme-color" content="#003F3D">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Mise en page : application mobile d'abord (une colonne, onglets en bas), tableau de bord en grille sur grand écran.
   Couleurs et police : charte Vases d'Honneur (vert VH, vert profond, jaune doré, Montserrat). */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#132523; --ink-2:#465B58; --muted:#6F8380; --line:#D9E2E0;
  --brand:#006C67; --brand-ink:#006C67; --brand-soft:#E3F0EE; --hdr:#003F3D; --hdr-ink:#FFFFFF;
  --gold:#D2AF1F; --gold-ink:#7E6400; --gold-soft:#FBF4D6;
  --crit:#B21E28; --crit-soft:#FBE7E8; --warn:#B45F0E; --warn-soft:#FDF0E1; --good:#2B7A4B; --good-soft:#E3F3E9;
  --chart:#00807A; --chart-fill:rgba(0,128,122,.14); --grid:#E3E9E8;
  --m1:#B21E28; --m2:#E08A6E; --m3:#BCB5AD; --m4:#5FA9A3; --m5:#006C67; --m0:#D9DFDE;
  --shadow:0 1px 2px rgba(10,40,38,.06),0 6px 20px rgba(10,40,38,.06);
  --font:"Montserrat",Helvetica,Arial,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1716; --surface:#13221F; --surface-2:#182A27; --ink:#E5EFED; --ink-2:#A8BCB8; --muted:#7E9591; --line:#24403B;
  --brand:#2AA79D; --brand-ink:#5CC6BC; --brand-soft:#173A36; --hdr:#062B29; --hdr-ink:#FFFFFF;
  --gold:#E2C044; --gold-ink:#E2C044; --gold-soft:#2E2A14;
  --crit:#F0646C; --crit-soft:#3A1C1F; --warn:#F0A04B; --warn-soft:#3A2A16; --good:#5CC08A; --good-soft:#163323;
  --chart:#3DB8AD; --chart-fill:rgba(61,184,173,.16); --grid:#203935;
  --m1:#F0646C; --m2:#E59A82; --m3:#6E6A66; --m4:#3E8F89; --m5:#4FC2B6; --m0:#2C3C3A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1716; --surface:#13221F; --surface-2:#182A27; --ink:#E5EFED; --ink-2:#A8BCB8; --muted:#7E9591; --line:#24403B;
  --brand:#2AA79D; --brand-ink:#5CC6BC; --brand-soft:#173A36; --hdr:#062B29; --hdr-ink:#FFFFFF;
  --gold:#E2C044; --gold-ink:#E2C044; --gold-soft:#2E2A14;
  --crit:#F0646C; --crit-soft:#3A1C1F; --warn:#F0A04B; --warn-soft:#3A2A16; --good:#5CC08A; --good-soft:#163323;
  --chart:#3DB8AD; --chart-fill:rgba(61,184,173,.16); --grid:#203935;
  --m1:#F0646C; --m2:#E59A82; --m3:#6E6A66; --m4:#3E8F89; --m5:#4FC2B6; --m0:#2C3C3A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
#app{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- en-tête ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:var(--hdr-ink)}
.hdr-in{display:flex;align-items:center;gap:12px;padding-block:10px;max-width:1240px;margin:0 auto}
.hdr img{height:26px;width:auto;display:block}
.hdr .who{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.hdr .who span{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
.btn-ghost-w{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.btn-ghost-w:hover{background:rgba(255,255,255,.2)}
.demo{background:var(--gold-soft);color:var(--gold-ink);font-size:12px;font-weight:600}
.demo .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:6px;max-width:1240px;margin:0 auto}
.demo button{background:none;border:0;color:inherit;text-decoration:underline;font-size:12px;font-weight:700;padding:0}
.tabs{display:flex;gap:4px;max-width:1240px;margin:0 auto;padding-block:0 0}
.tabs button{background:none;border:0;color:rgba(255,255,255,.75);font-weight:600;font-size:14px;padding:10px 14px;border-bottom:3px solid transparent}
.tabs button[aria-current="page"]{color:#fff;border-bottom-color:var(--gold)}
.bottom-nav{display:none}
@media (max-width:759px){
  .tabs{display:none}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottom-nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px}
  .bottom-nav button svg{width:22px;height:22px}
  .bottom-nav button[aria-current="page"]{color:var(--brand-ink);background:var(--brand-soft)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
main{max-width:1240px;margin:0 auto;padding-block:20px 40px}
.narrow{max-width:760px;margin:0 auto}

/* ---------- briques ---------- */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:16px;font-weight:700}
.card-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;border:1px solid transparent;text-decoration:none}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{filter:brightness(1.08)}
.btn-p:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-s{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--brand)}
.btn-sm{padding:7px 12px;font-size:13px}
.link{background:none;border:0;color:var(--brand-ink);font-weight:700;padding:0;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill svg{width:13px;height:13px;flex:none}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-good{background:var(--good-soft);color:var(--good)}
.p-neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.p-brand{background:var(--brand-soft);color:var(--brand-ink)}
.rang{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.rang.GA{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.rang.AP{background:var(--hdr);color:#fff;border-color:transparent}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--brand-soft);color:var(--brand-ink);flex:none}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .name{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.li .sub{font-size:13px;color:var(--muted)}
button.li{background:none;border:0;border-top:1px solid var(--line);text-align:left;width:100%;border-radius:0}
button.li:first-child{border-top:0}
button.li:hover .name{color:var(--brand-ink)}
.chev{color:var(--muted);flex:none}
.dots{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--m0)}
.dot.on{background:var(--brand)}
.dot.off{background:transparent;border:2px solid var(--m3)}
.mchip{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:12px;font-weight:800;color:#fff}
.mchip.m0{background:var(--m0);color:var(--ink-2)}
.m-1{background:var(--m1)} .m-2{background:var(--m2)} .m-3{background:var(--m3);color:var(--ink)} .m-4{background:var(--m4)} .m-5{background:var(--m5)}
.progress{height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:999px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hdr);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:760px){.toast{bottom:28px}}

/* ---------- connexion / choix du rôle ---------- */
body.on-login{background:var(--hdr)}
.login{display:grid;place-items:center;background:var(--hdr);padding-block:32px}
.login-in{width:100%;max-width:520px;display:flex;flex-direction:column;gap:22px;color:#fff}
.login-in img.lg{width:min(320px,80%);height:auto}
.login-in h1{font-size:22px;font-weight:800}
.login-in p{color:rgba(255,255,255,.8);font-size:14px}
.role{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:var(--r);padding:16px;color:#fff}
.role:hover{background:rgba(255,255,255,.13);border-color:var(--gold)}
.role b{display:block;font-size:15px}
.role small{display:block;color:rgba(255,255,255,.75);font-size:13px;margin-top:2px}
.role .ic{width:44px;height:44px;border-radius:12px;background:rgba(210,175,31,.18);display:grid;place-items:center;flex:none;color:var(--gold)}
.login .note{font-size:12px;color:rgba(255,255,255,.6)}

/* ---------- page d'accueil responsable ---------- */
.hello h1{font-size:24px;font-weight:800}
.hello p{color:var(--ink-2);margin-top:4px}
.report-hero{background:var(--hdr);color:#fff;border:0}
.report-hero .eyebrow{color:rgba(255,255,255,.65)}
.report-hero h2{font-size:20px;margin-top:6px}
.report-hero .progress{background:rgba(255,255,255,.15);border-color:transparent;margin-top:14px}
.report-hero .progress i{background:var(--gold)}
.report-hero .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:rgba(255,255,255,.8)}
.report-hero .btn-p{background:var(--gold);color:#1d1a08;margin-top:16px}
.special{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);color:var(--gold-ink);border-radius:var(--r-sm);padding:12px 14px;font-size:13px;font-weight:600}
.special svg{flex:none;width:18px;height:18px;margin-top:1px}

/* ---------- formulaire de rapport ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(5,25,23,.55);z-index:50;display:flex;justify-content:center;align-items:flex-end}
@media (min-width:760px){.sheet-bg{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:100%;overflow:auto;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
@media (min-width:760px){.sheet{border-radius:18px;max-height:calc(100vh - 48px)}}
.sheet-hd{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:center;padding-top:calc(14px + env(safe-area-inset-top,0px))}
@media (min-width:760px){.sheet-hd{padding-top:14px}}
.sheet-hd .grow{flex:1;min-width:0}
.sheet-hd h2{font-size:17px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.sheet-bd{padding:16px;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-ft{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.q h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.q h3 small{font-weight:500;color:var(--muted);font-size:12px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prow:first-of-type{border-top:0}
.prow .lbl{font-size:14px;font-weight:600;min-width:0}
.prow .lbl small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"].yes{background:var(--brand);color:#fff}
.seg button[aria-pressed="true"].no{background:var(--crit);color:#fff}
.seg button[aria-pressed="true"].neu{background:var(--ink-2);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.chip.urg[aria-pressed="true"]{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.scale{display:grid;grid-template-columns:repeat(5,1fr) 1.3fr;gap:6px}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-weight:800;font-size:15px;color:var(--ink-2)}
.scale button.dk{font-size:11px;font-weight:700;line-height:1.15;padding:6px 4px}
.scale button[aria-pressed="true"]{color:#fff;border-color:transparent}
.scale button[aria-pressed="true"].v1{background:var(--m1)} .scale button[aria-pressed="true"].v2{background:var(--m2)}
.scale button[aria-pressed="true"].v3{background:var(--m3);color:var(--ink)} .scale button[aria-pressed="true"].v4{background:var(--m4)}
.scale button[aria-pressed="true"].v5{background:var(--m5)} .scale button[aria-pressed="true"].v0{background:var(--ink-2);color:var(--surface)}
.anchor{font-size:12.5px;color:var(--ink-2);margin-top:8px;min-height:18px}
.axis+.axis{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.axis-t{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;margin-bottom:8px;flex-wrap:wrap}
.axis-t small{font-weight:500;color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:14px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.lock{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:9px 10px}
.lock svg{width:15px;height:15px;flex:none;margin-top:1px}
.hint{font-size:12.5px;color:var(--muted)}

/* ---------- tableau de bord ---------- */
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.dash-head h1{font-size:24px;font-weight:800}
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;max-width:100%}
.weeks button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.weeks button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.kpi .v small{font-size:14px;font-weight:700;color:var(--muted)}
.kpi .d{font-size:12px;font-weight:700}
.kpi .d.up{color:var(--good)} .kpi .d.down{color:var(--crit)} .kpi .d.flat{color:var(--muted)}
.kpi svg{width:100%;height:30px;display:block}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:980px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.alert{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.alert:first-child{border-top:0}
.alert .grow{flex:1;min-width:0}
.sev{width:4px;align-self:stretch;border-radius:4px;background:var(--warn);flex:none}
.sev.crit{background:var(--crit)}
.alert .reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.reasons .pill{white-space:normal}
.alert .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.taken{font-size:12.5px;color:var(--good);font-weight:700;margin-top:8px;display:flex;gap:6px;align-items:center}
.tree .zone{padding:12px 0;border-top:1px solid var(--line)}
.tree .zone:first-child{border-top:0;padding-top:0}
.tree .fam{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.tree .fam b{font-size:14px}
.gemrow{display:grid;grid-template-columns:minmax(0,1.4fr) 70px 64px 92px;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;background:none;border:0;width:100%;text-align:left;font-size:13.5px}
.gemrow:hover{background:var(--surface-2)}
.gemrow .gn{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gemrow .gn small{display:block;font-weight:500;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.gemgrid{display:grid;grid-template-columns:minmax(0,1.4fr) 70px 64px 92px;gap:10px}
@media (max-width:520px){.gemrow,.gemgrid{grid-template-columns:minmax(0,1fr) 46px 32px 64px;gap:6px}.gemrow{padding-inline:4px}}
.gemhead{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px}
.minibar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--chart)}

/* ---------- pyramide d'intégration ----------
   Les paliers montent du gris chaud (zone d'intégration) au vert VH de plus en plus profond ; le sommet porte l'or. */
:root{
  --t-nouveau:#EFEBE6; --t-irregulier:#D6D1CB; --t-deserteur:#CBC4BC; --t-hatch:#DED8D1; --t-regulier:#D3E9E5; --t-actif:#A3D0CA;
  --t-potentiel:#68AFA8; --t-position:#227F79; --t-permission:#006C67; --t-objectif:#004F4B; --t-reproduction:#003F3D;
  --x-dark:#132523; --x-light:#FFFFFF; --x-top:#D2AF1F; --ring:#D2AF1F;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --t-nouveau:#2B2824; --t-irregulier:#3A3631; --t-deserteur:#2E2A26; --t-hatch:#3A3631; --t-regulier:#183D39; --t-actif:#1C4E49;
  --t-potentiel:#21605A; --t-position:#26736C; --t-permission:#34A096; --t-objectif:#5CC6BC; --t-reproduction:#E2C044;
  --x-dark:#0C1716; --x-light:#E5EFED; --x-top:#0C1716; --ring:#FFFFFF;
}}
:root[data-theme="dark"]{
  --t-nouveau:#2B2824; --t-irregulier:#3A3631; --t-deserteur:#2E2A26; --t-hatch:#3A3631; --t-regulier:#183D39; --t-actif:#1C4E49;
  --t-potentiel:#21605A; --t-position:#26736C; --t-permission:#34A096; --t-objectif:#5CC6BC; --t-reproduction:#E2C044;
  --x-dark:#0C1716; --x-light:#E5EFED; --x-top:#0C1716; --ring:#FFFFFF;
}
.t-nouveau{--bgc:var(--t-nouveau);--txc:var(--ink)} .t-irregulier{--bgc:var(--t-irregulier);--txc:var(--ink)}
.t-deserteur{--bgc:repeating-linear-gradient(135deg,var(--t-deserteur) 0 6px,var(--t-hatch) 6px 12px);--txc:var(--ink)}
.t-regulier{--bgc:var(--t-regulier);--txc:var(--ink)} .t-actif{--bgc:var(--t-actif);--txc:var(--ink)} .t-potentiel{--bgc:var(--t-potentiel);--txc:var(--ink)}
.t-position{--bgc:var(--t-position);--txc:var(--x-light)} .t-permission{--bgc:var(--t-permission);--txc:#fff} .t-objectif{--bgc:var(--t-objectif);--txc:#fff}
.t-reproduction{--bgc:var(--t-reproduction);--txc:var(--x-top)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(.t-permission,.t-objectif){--txc:var(--x-dark)}}
:root[data-theme="dark"] :is(.t-permission,.t-objectif){--txc:var(--x-dark)}
.pyr{position:relative;padding:2px 0 14px 42px;--h:52px;--g:5px}
@media (max-width:520px){.pyr{--h:48px;padding-left:30px}}
.pyr-body{position:relative}
.pyr-row{display:flex;justify-content:center;gap:6px;height:var(--h);margin-top:var(--g);position:relative;z-index:1}
.tier{position:relative;height:100%;border:0;padding:0 8px;background:none;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.12;min-width:0}
.tier .sh{position:absolute;inset:0;clip-path:var(--clip);background:var(--bgc);transition:filter .15s}
.tier .tx{position:relative;color:var(--txc);font-weight:800;font-size:13.5px;letter-spacing:-.005em;min-width:0}
.tier .tx small{display:block;font-weight:600;font-size:12px;opacity:.86;margin-top:3px}
.tier .s{display:none}
@media (max-width:620px){.tier .f{display:none}.tier .s{display:inline}.tier .tx{font-size:12.5px}.tier .tx small{font-size:11.5px}}
.tier:hover .sh{filter:brightness(1.07) saturate(1.05)}
.tier[aria-pressed="true"]{filter:drop-shadow(0 0 1px var(--ring)) drop-shadow(0 0 1px var(--ring)) drop-shadow(0 0 1.5px var(--ring))}
.tier:focus-visible{outline:none}
.tier:focus-visible .tx{text-decoration:underline;text-underline-offset:3px}
.brk{position:absolute;left:0;width:34px;display:flex;align-items:center;justify-content:flex-start}
.brk::after{content:"";position:absolute;right:4px;top:0;bottom:0;width:7px;border:2px solid var(--line);border-right:0;border-radius:7px 0 0 7px}
.brk span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
@media (max-width:520px){.brk{width:24px}.brk::after{right:2px;width:6px}.brk span{font-size:9px;letter-spacing:.08em}}
.integr{position:absolute;left:-6px;right:-6px;border:1.5px dashed var(--muted);border-radius:12px;opacity:.55;z-index:0}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prep{display:grid;grid-template-columns:minmax(0,1.5fr) 30px minmax(0,1fr) 50px;gap:10px;align-items:center;padding:7px 4px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;font-size:13.5px;border-radius:0}

.prep .t{height:8px;border-radius:0 4px 4px 0;background:var(--surface-2);overflow:hidden}

.delta{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:2px;justify-content:flex-end;color:var(--muted)}
.delta svg{width:13px;height:13px}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)}
.mv-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.mv-ic.up,.mv-ic.new{background:var(--good-soft);color:var(--good)} .mv-ic.down{background:var(--warn-soft);color:var(--warn)}
.pal-hd{display:flex;gap:12px;align-items:center}
.pal-hd .sw{width:40px;height:40px;border-radius:10px;background:var(--bgc);flex:none;display:grid;place-items:center;color:var(--txc);font-weight:800;font-size:14px}

@media (prefers-reduced-motion:no-preference){
  .pyr.anim .tier{animation:tierIn .55s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i) * 55ms)}
  @keyframes tierIn{from{opacity:0;transform:translateY(12px) scale(.94)}}
}

async function envoyer() {
  C.envoi = true; C.msg = ""; rendre();
  const carte = { ...C.b, lang: C.lang }, jeton = stock.lire("m360-jeton") || stock.lire("m360-jeton", true);
  const r = EQUIPE && jeton ? await api("carte_equipe", { jeton, carte }) : await api("carte", { carte, duree: Date.now() - C.t0, site: $(".piege")?.value || "" });
  C.envoi = false;
  if (r.ok) { C.ok = { prenom: C.b.prenom.trim(), intention: C.b.intention }; scrollTo(0, 0); }
  else C.msg = erreur(r);
  rendre();
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  if (a === "lang") { choisirLangue(v); C.lang = v; C.msg = ""; rendre(); }
  if (a === "set") { C.b[b.dataset.k] = v; rendre(); }
  if (a === "envoyer" && !b.disabled) envoyer();
  if (a === "neuve") { C.b = vide(); C.ok = null; C.t0 = Date.now(); rendre(); scrollTo(0, 0); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (!t.dataset.cf) return;
  C.b[t.dataset.cf] = t.value; C.msg = "";
  // Le bouton suit la saisie sans redessiner la page : le curseur reste dans le champ
  const m = manque(C.b, TX[C.lang]), btn = $('[data-a="envoyer"]'), aide = $("#c-manque");
  if (btn) btn.disabled = m.length > 0;
  if (aide) aide.textContent = m.length ? TX[C.lang].manque + m.join(", ") + "." : "";
});
document.addEventListener("change", (e) => { if (e.target.dataset.cc) { C.b[e.target.dataset.cc] = e.target.checked; rendre(); } });
document.addEventListener("submit", (e) => e.preventDefault());
rendre();

</script>
