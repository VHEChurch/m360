<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M360 · Entraînement</title>
<meta name="description" content="Copie d'entraînement de M360, données fictives.">
<meta name="theme-color" content="#003F3D">
<meta name="robots" content="noindex">
<link rel="icon" href="../../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Mise en page : application mobile d'abord (une colonne, onglets en bas), tableau de bord en grille sur grand écran.
   Couleurs et police : charte Vases d'Honneur (vert VH, vert profond, jaune doré, Montserrat). */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#132523; --ink-2:#465B58; --muted:#6F8380; --line:#D9E2E0;
  --brand:#006C67; --brand-ink:#006C67; --brand-soft:#E3F0EE; --hdr:#003F3D; --hdr-ink:#FFFFFF;
  --gold:#D2AF1F; --gold-ink:#7E6400; --gold-soft:#FBF4D6;
  --crit:#B21E28; --crit-soft:#FBE7E8; --warn:#B45F0E; --warn-soft:#FDF0E1; --good:#2B7A4B; --good-soft:#E3F3E9;
  --chart:#00807A; --chart-fill:rgba(0,128,122,.14); --grid:#E3E9E8;
  --m1:#B21E28; --m2:#E08A6E; --m3:#BCB5AD; --m4:#5FA9A3; --m5:#006C67; --m0:#D9DFDE;
  --shadow:0 1px 2px rgba(10,40,38,.06),0 6px 20px rgba(10,40,38,.06);
  --font:"Montserrat",Helvetica,Arial,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1716; --surface:#13221F; --surface-2:#182A27; --ink:#E5EFED; --ink-2:#A8BCB8; --muted:#7E9591; --line:#24403B;
  --brand:#2AA79D; --brand-ink:#5CC6BC; --brand-soft:#173A36; --hdr:#062B29; --hdr-ink:#FFFFFF;
  --gold:#E2C044; --gold-ink:#E2C044; --gold-soft:#2E2A14;
  --crit:#F0646C; --crit-soft:#3A1C1F; --warn:#F0A04B; --warn-soft:#3A2A16; --good:#5CC08A; --good-soft:#163323;
  --chart:#3DB8AD; --chart-fill:rgba(61,184,173,.16); --grid:#203935;
  --m1:#F0646C; --m2:#E59A82; --m3:#6E6A66; --m4:#3E8F89; --m5:#4FC2B6; --m0:#2C3C3A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1716; --surface:#13221F; --surface-2:#182A27; --ink:#E5EFED; --ink-2:#A8BCB8; --muted:#7E9591; --line:#24403B;
  --brand:#2AA79D; --brand-ink:#5CC6BC; --brand-soft:#173A36; --hdr:#062B29; --hdr-ink:#FFFFFF;
  --gold:#E2C044; --gold-ink:#E2C044; --gold-soft:#2E2A14;
  --crit:#F0646C; --crit-soft:#3A1C1F; --warn:#F0A04B; --warn-soft:#3A2A16; --good:#5CC08A; --good-soft:#163323;
  --chart:#3DB8AD; --chart-fill:rgba(61,184,173,.16); --grid:#203935;
  --m1:#F0646C; --m2:#E59A82; --m3:#6E6A66; --m4:#3E8F89; --m5:#4FC2B6; --m0:#2C3C3A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
#app{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- en-tête ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:var(--hdr-ink)}
.hdr-in{display:flex;align-items:center;gap:12px;padding-block:10px;max-width:1240px;margin:0 auto}
.hdr img{height:26px;width:auto;display:block}
.hdr .who{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.hdr .who span{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
.btn-ghost-w{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.btn-ghost-w:hover{background:rgba(255,255,255,.2)}
.demo{background:var(--gold-soft);color:var(--gold-ink);font-size:12px;font-weight:600}
.demo .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:6px;max-width:1240px;margin:0 auto}
.demo button{background:none;border:0;color:inherit;text-decoration:underline;font-size:12px;font-weight:700;padding:0}
.tabs{display:flex;gap:4px;max-width:1240px;margin:0 auto;padding-block:0 0}
.tabs button{background:none;border:0;color:rgba(255,255,255,.75);font-weight:600;font-size:14px;padding:10px 14px;border-bottom:3px solid transparent}
.tabs button[aria-current="page"]{color:#fff;border-bottom-color:var(--gold)}
.bottom-nav{display:none}
@media (max-width:759px){
  .tabs{display:none}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottom-nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px}
  .bottom-nav button svg{width:22px;height:22px}
  .bottom-nav button[aria-current="page"]{color:var(--brand-ink);background:var(--brand-soft)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
main{max-width:1240px;margin:0 auto;padding-block:20px 40px}
.narrow{max-width:760px;margin:0 auto}

/* ---------- briques ---------- */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:16px;font-weight:700}
.card-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;border:1px solid transparent;text-decoration:none}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{filter:brightness(1.08)}
.btn-p:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-s{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--brand)}
.btn-sm{padding:7px 12px;font-size:13px}
.link{background:none;border:0;color:var(--brand-ink);font-weight:700;padding:0;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill svg{width:13px;height:13px;flex:none}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-good{background:var(--good-soft);color:var(--good)}
.p-neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.p-brand{background:var(--brand-soft);color:var(--brand-ink)}
.rang{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.rang.GA{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.rang.AP{background:var(--hdr);color:#fff;border-color:transparent}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--brand-soft);color:var(--brand-ink);flex:none}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .name{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.li .sub{font-size:13px;color:var(--muted)}
button.li{background:none;border:0;border-top:1px solid var(--line);text-align:left;width:100%;border-radius:0}
button.li:first-child{border-top:0}
button.li:hover .name{color:var(--brand-ink)}
.chev{color:var(--muted);flex:none}
.dots{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--m0)}
.dot.on{background:var(--brand)}
.dot.off{background:transparent;border:2px solid var(--m3)}
.mchip{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:12px;font-weight:800;color:#fff}
.mchip.m0{background:var(--m0);color:var(--ink-2)}
.m-1{background:var(--m1)} .m-2{background:var(--m2)} .m-3{background:var(--m3);color:var(--ink)} .m-4{background:var(--m4)} .m-5{background:var(--m5)}
.progress{height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:999px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hdr);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:760px){.toast{bottom:28px}}

/* ---------- connexion / choix du rôle ---------- */
body.on-login{background:var(--hdr)}
.login{display:grid;place-items:center;background:var(--hdr);padding-block:32px}
.login-in{width:100%;max-width:520px;display:flex;flex-direction:column;gap:22px;color:#fff}
.login-in img.lg{width:min(320px,80%);height:auto}
.login-in h1{font-size:22px;font-weight:800}
.login-in p{color:rgba(255,255,255,.8);font-size:14px}
.role{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:var(--r);padding:16px;color:#fff}
.role:hover{background:rgba(255,255,255,.13);border-color:var(--gold)}
.role b{display:block;font-size:15px}
.role small{display:block;color:rgba(255,255,255,.75);font-size:13px;margin-top:2px}
.role .ic{width:44px;height:44px;border-radius:12px;background:rgba(210,175,31,.18);display:grid;place-items:center;flex:none;color:var(--gold)}
.login .note{font-size:12px;color:rgba(255,255,255,.6)}

/* ---------- page d'accueil responsable ---------- */
.hello h1{font-size:24px;font-weight:800}
.hello p{color:var(--ink-2);margin-top:4px}
.report-hero{background:var(--hdr);color:#fff;border:0}
.report-hero .eyebrow{color:rgba(255,255,255,.65)}
.report-hero h2{font-size:20px;margin-top:6px}
.report-hero .progress{background:rgba(255,255,255,.15);border-color:transparent;margin-top:14px}
.report-hero .progress i{background:var(--gold)}
.report-hero .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:rgba(255,255,255,.8)}
.report-hero .btn-p{background:var(--gold);color:#1d1a08;margin-top:16px}
.special{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);color:var(--gold-ink);border-radius:var(--r-sm);padding:12px 14px;font-size:13px;font-weight:600}
.special svg{flex:none;width:18px;height:18px;margin-top:1px}

/* ---------- formulaire de rapport ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(5,25,23,.55);z-index:50;display:flex;justify-content:center;align-items:flex-end}
@media (min-width:760px){.sheet-bg{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:100%;overflow:auto;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
@media (min-width:760px){.sheet{border-radius:18px;max-height:calc(100vh - 48px)}}
.sheet-hd{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:center;padding-top:calc(14px + env(safe-area-inset-top,0px))}
@media (min-width:760px){.sheet-hd{padding-top:14px}}
.sheet-hd .grow{flex:1;min-width:0}
.sheet-hd h2{font-size:17px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.sheet-bd{padding:16px;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-ft{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.q h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.q h3 small{font-weight:500;color:var(--muted);font-size:12px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prow:first-of-type{border-top:0}
.prow .lbl{font-size:14px;font-weight:600;min-width:0}
.prow .lbl small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"].yes{background:var(--brand);color:#fff}
.seg button[aria-pressed="true"].no{background:var(--crit);color:#fff}
.seg button[aria-pressed="true"].neu{background:var(--ink-2);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.chip.urg[aria-pressed="true"]{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.scale{display:grid;grid-template-columns:repeat(5,1fr) 1.3fr;gap:6px}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-weight:800;font-size:15px;color:var(--ink-2)}
.scale button.dk{font-size:11px;font-weight:700;line-height:1.15;padding:6px 4px}
.scale button[aria-pressed="true"]{color:#fff;border-color:transparent}
.scale button[aria-pressed="true"].v1{background:var(--m1)} .scale button[aria-pressed="true"].v2{background:var(--m2)}
.scale button[aria-pressed="true"].v3{background:var(--m3);color:var(--ink)} .scale button[aria-pressed="true"].v4{background:var(--m4)}
.scale button[aria-pressed="true"].v5{background:var(--m5)} .scale button[aria-pressed="true"].v0{background:var(--ink-2);color:var(--surface)}
.anchor{font-size:12.5px;color:var(--ink-2);margin-top:8px;min-height:18px}
.axis+.axis{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.axis-t{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;margin-bottom:8px;flex-wrap:wrap}
.axis-t small{font-weight:500;color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:14px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.lock{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:9px 10px}
.lock svg{width:15px;height:15px;flex:none;margin-top:1px}
.hint{font-size:12.5px;color:var(--muted)}

/* ---------- tableau de bord ---------- */
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.dash-head h1{font-size:24px;font-weight:800}
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;max-width:100%}
.weeks button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.weeks button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.kpi .v small{font-size:14px;font-weight:700;color:var(--muted)}
.kpi .d{font-size:12px;font-weight:700}
.kpi .d.up{color:var(--good)} .kpi .d.down{color:var(--crit)} .kpi .d.flat{color:var(--muted)}
.kpi svg{width:100%;height:30px;display:block}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:980px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.alert{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.alert:first-child{border-top:0}
.alert .grow{flex:1;min-width:0}
.sev{width:4px;align-self:stretch;border-radius:4px;background:var(--warn);flex:none}
.sev.crit{background:var(--crit)}
.alert .reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.reasons .pill{white-space:normal}
.alert .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.taken{font-size:12.5px;color:var(--good);font-weight:700;margin-top:8px;display:flex;gap:6px;align-items:center}
.tree .zone{padding:12px 0;border-top:1px solid var(--line)}
.tree .zone:first-child{border-top:0;padding-top:0}
.tree .fam{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.tree .fam b{font-size:14px}
.gemrow{display:grid;grid-template-columns:minmax(0,1.4fr) 70px 64px 92px;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;background:none;border:0;width:100%;text-align:left;font-size:13.5px}
.gemrow:hover{background:var(--surface-2)}
.gemrow .gn{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gemrow .gn small{display:block;font-weight:500;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.gemgrid{display:grid;grid-template-columns:minmax(0,1.4fr) 70px 64px 92px;gap:10px}
@media (max-width:520px){.gemrow,.gemgrid{grid-template-columns:minmax(0,1fr) 46px 32px 64px;gap:6px}.gemrow{padding-inline:4px}}
.gemhead{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px}
.minibar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--chart)}
.stackbar{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden}
.stackbar span{display:block;height:100%}
.stackbar .h0{background:repeating-linear-gradient(135deg,var(--m0) 0 4px,var(--surface-2) 4px 8px)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.hbar .t{height:10px;border-radius:0 5px 5px 0;background:var(--surface-2)}
.hbar .t i{display:block;height:100%;background:var(--chart);border-radius:0 5px 5px 0}
.trend svg{width:100%;height:auto;display:block}
.trend text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:600;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px))}
.feed .it{padding:11px 0;border-top:1px solid var(--line)}
.feed .it:first-child{border-top:0}
.feed .it p{font-size:14px}
.feed .it small{color:var(--muted);font-size:12px}
table.hist{border-collapse:collapse;width:100%;font-size:13px}
table.hist th,table.hist td{padding:7px 6px;text-align:center;border-top:1px solid var(--line)}
table.hist th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;border-top:0}
table.hist td:first-child,table.hist th:first-child{text-align:left}
.tbl-wrap{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0}
.kv.nums dd{white-space:nowrap;text-align:right}
.copy{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.signal{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);color:var(--brand-ink);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;font-weight:600}
.signal svg{width:18px;height:18px;flex:none}
.cursus{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;margin-top:6px}
.cursus span{display:block;height:100%}
.done-hero{text-align:center;padding:36px 18px}
.done-hero .ic{width:64px;height:64px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* ---------- pyramide d'intégration ----------
   Les paliers montent du gris chaud (zone d'intégration) au vert VH de plus en plus profond ; le sommet porte l'or. */
:root{
  --t-nouveau:#EFEBE6; --t-irregulier:#D6D1CB; --t-deserteur:#CBC4BC; --t-hatch:#DED8D1; --t-regulier:#D3E9E5; --t-actif:#A3D0CA;
  --t-potentiel:#68AFA8; --t-position:#227F79; --t-permission:#006C67; --t-objectif:#004F4B; --t-reproduction:#003F3D;
  --x-dark:#132523; --x-light:#FFFFFF; --x-top:#D2AF1F; --ring:#D2AF1F;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --t-nouveau:#2B2824; --t-irregulier:#3A3631; --t-deserteur:#2E2A26; --t-hatch:#3A3631; --t-regulier:#183D39; --t-actif:#1C4E49;
  --t-potentiel:#21605A; --t-position:#26736C; --t-permission:#34A096; --t-objectif:#5CC6BC; --t-reproduction:#E2C044;
  --x-dark:#0C1716; --x-light:#E5EFED; --x-top:#0C1716; --ring:#FFFFFF;
}}
:root[data-theme="dark"]{
  --t-nouveau:#2B2824; --t-irregulier:#3A3631; --t-deserteur:#2E2A26; --t-hatch:#3A3631; --t-regulier:#183D39; --t-actif:#1C4E49;
  --t-potentiel:#21605A; --t-position:#26736C; --t-permission:#34A096; --t-objectif:#5CC6BC; --t-reproduction:#E2C044;
  --x-dark:#0C1716; --x-light:#E5EFED; --x-top:#0C1716; --ring:#FFFFFF;
}
.t-nouveau{--bgc:var(--t-nouveau);--txc:var(--ink)} .t-irregulier{--bgc:var(--t-irregulier);--txc:var(--ink)}
.t-deserteur{--bgc:repeating-linear-gradient(135deg,var(--t-deserteur) 0 6px,var(--t-hatch) 6px 12px);--txc:var(--ink)}
.t-regulier{--bgc:var(--t-regulier);--txc:var(--ink)} .t-actif{--bgc:var(--t-actif);--txc:var(--ink)} .t-potentiel{--bgc:var(--t-potentiel);--txc:var(--ink)}
.t-position{--bgc:var(--t-position);--txc:var(--x-light)} .t-permission{--bgc:var(--t-permission);--txc:#fff} .t-objectif{--bgc:var(--t-objectif);--txc:#fff}
.t-reproduction{--bgc:var(--t-reproduction);--txc:var(--x-top)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(.t-permission,.t-objectif){--txc:var(--x-dark)}}
:root[data-theme="dark"] :is(.t-permission,.t-objectif){--txc:var(--x-dark)}
.pyr{position:relative;padding:2px 0 14px 42px;--h:52px;--g:5px}
@media (max-width:520px){.pyr{--h:48px;padding-left:30px}}
.pyr-body{position:relative}
.pyr-row{display:flex;justify-content:center;gap:6px;height:var(--h);margin-top:var(--g);position:relative;z-index:1}
.tier{position:relative;height:100%;border:0;padding:0 8px;background:none;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.12;min-width:0}
.tier .sh{position:absolute;inset:0;clip-path:var(--clip);background:var(--bgc);transition:filter .15s}
.tier .tx{position:relative;color:var(--txc);font-weight:800;font-size:13.5px;letter-spacing:-.005em;min-width:0}
.tier .tx small{display:block;font-weight:600;font-size:12px;opacity:.86;margin-top:3px}
.tier .s{display:none}
@media (max-width:620px){.tier .f{display:none}.tier .s{display:inline}.tier .tx{font-size:12.5px}.tier .tx small{font-size:11.5px}}
.tier:hover .sh{filter:brightness(1.07) saturate(1.05)}
.tier[aria-pressed="true"]{filter:drop-shadow(0 0 1px var(--ring)) drop-shadow(0 0 1px var(--ring)) drop-shadow(0 0 1.5px var(--ring))}
.tier:focus-visible{outline:none}
.tier:focus-visible .tx{text-decoration:underline;text-underline-offset:3px}
.brk{position:absolute;left:0;width:34px;display:flex;align-items:center;justify-content:flex-start}
.brk::after{content:"";position:absolute;right:4px;top:0;bottom:0;width:7px;border:2px solid var(--line);border-right:0;border-radius:7px 0 0 7px}
.brk span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
@media (max-width:520px){.brk{width:24px}.brk::after{right:2px;width:6px}.brk span{font-size:9px;letter-spacing:.08em}}
.integr{position:absolute;left:-6px;right:-6px;border:1.5px dashed var(--muted);border-radius:12px;opacity:.55;z-index:0}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prep{display:grid;grid-template-columns:minmax(0,1.5fr) 30px minmax(0,1fr) 50px;gap:10px;align-items:center;padding:7px 4px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;font-size:13.5px;border-radius:0}
.prep:first-of-type{border-top:0}
.prep:hover{background:var(--surface-2)}
.prep[aria-pressed="true"]{background:var(--brand-soft)}
.prep .lb{display:flex;gap:8px;align-items:center;font-weight:700;min-width:0}
.prep .lb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prep .sw{width:12px;height:12px;border-radius:3px;background:var(--bgc);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.prep .t{height:8px;border-radius:0 4px 4px 0;background:var(--surface-2);overflow:hidden}
.prep .t i{display:block;height:100%;background:var(--chart);border-radius:0 4px 4px 0}
.delta{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:2px;justify-content:flex-end;color:var(--muted)}
.delta svg{width:13px;height:13px}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)}
.mv-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.mv-ic.up,.mv-ic.new{background:var(--good-soft);color:var(--good)} .mv-ic.down{background:var(--warn-soft);color:var(--warn)}
.pal-hd{display:flex;gap:12px;align-items:center}
.pal-hd .sw{width:40px;height:40px;border-radius:10px;background:var(--bgc);flex:none;display:grid;place-items:center;color:var(--txc);font-weight:800;font-size:14px}
.pal-list{max-height:520px;overflow:auto;margin-top:6px}
.sheet .pal-list{max-height:none}
@media (prefers-reduced-motion:no-preference){
  .pyr.anim .tier{animation:tierIn .55s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i) * 55ms)}
  @keyframes tierIn{from{opacity:0;transform:translateY(12px) scale(.94)}}
}

/* ---------- maquette intégrée (29.10.2026) : cercles, brebis retrouvées, service du temple, activités ---------- */
:root{--s-revenu:#006C67;--s-chemin:#3F9A93;--s-joint:#9ECFC9;--s-sans:#D6D1CB;--s-pas:#B4ACA3;--s-afaire:#EEF2F1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s-revenu:#5CC6BC;--s-chemin:#2F8C84;--s-joint:#1F5C56;--s-sans:#3A3631;--s-pas:#4E4842;--s-afaire:#1A2826}}
:root[data-theme="dark"]{--s-revenu:#5CC6BC;--s-chemin:#2F8C84;--s-joint:#1F5C56;--s-sans:#3A3631;--s-pas:#4E4842;--s-afaire:#1A2826}
.st-revenu{--sc:var(--s-revenu)} .st-en_chemin{--sc:var(--s-chemin)} .st-joint{--sc:var(--s-joint)} .st-sans_reponse{--sc:var(--s-sans)} .st-pas_maintenant{--sc:var(--s-pas)} .st-a_contacter{--sc:var(--s-afaire)}
.sb-st span{background:var(--sc)} .sb-st .st-a_contacter{box-shadow:inset 0 0 0 1px var(--line)}
.legend [class^="st-"] i,.spill i{background:var(--sc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.legend b{color:var(--ink);margin-left:2px}
.spill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);flex:none}
.spill i{width:9px;height:9px;border-radius:50%}
.ppill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.ppill i{width:9px;height:9px;border-radius:3px;background:var(--bgc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.bottom-nav.n6 button{font-size:10.5px;padding-inline:0}
.sheet:focus{outline:none}
.plain{background:none;border:0;padding:0;text-align:left;min-width:0;display:block;color:inherit}
.plain small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.icon-btn.wa{color:var(--brand-ink);text-decoration:none}
.send-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:sticky;bottom:12px;box-shadow:var(--shadow)}
@media (max-width:759px){.send-bar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.send-bar .hint{flex:1;min-width:160px}

/* présences du cercle */
.pts{display:flex;gap:5px;flex:none}
.pt{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:800;color:var(--muted);display:grid;place-items:center;padding:0}
.pt.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pt.off{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.pt-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.pt-leg b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);font-size:10.5px;margin-right:4px}
.scale.s5{grid-template-columns:repeat(5,1fr)}
.wa-msg{font-size:14px;background:var(--brand-soft);color:var(--ink);border-radius:12px 12px 12px 4px;padding:10px 12px;line-height:1.45}

/* service du temple */
.serv-hero{background:var(--gold-soft);border-color:transparent}
.serv-hero .eyebrow{color:var(--gold-ink)}
.serv-ic{width:46px;height:46px;border-radius:12px;background:var(--gold);color:#1d1a08;display:grid;place-items:center;flex:none}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:460px){.checks{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--ink)}
.check .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.check[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.check[aria-pressed="true"] .bx{background:var(--brand);border-color:var(--brand)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--brand);color:var(--brand-ink);cursor:pointer;background:var(--brand-soft)}
.ph.add small{font-size:11px;font-weight:700;text-align:center;line-height:1.2;padding:0 4px}
.drive{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);margin-top:10px;word-break:break-word}
.drive svg{flex:none;margin-top:1px;color:var(--gold-ink)}
.attest{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:14px;font-weight:600;cursor:pointer}
.attest input{width:20px;height:20px;flex:none;accent-color:var(--brand);margin:1px 0 0}
.srv{padding:14px 0;border-top:1px solid var(--line)}
.srv:first-of-type{border-top:0}
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.gph{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.gph img{width:100%;height:100%;object-fit:cover;display:block}
.gph b{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font-size:16px}
.stars{display:inline-flex;gap:1px;flex:none}
.stars i,.stars button{color:var(--line);display:grid;place-items:center}
.stars button{background:none;border:0;padding:3px;border-radius:6px}
.stars .on{color:var(--gold)}
.stars .on svg{fill:currentColor}
.stars button:hover svg{fill:var(--gold-soft)}
.stars button.on:hover svg{fill:currentColor}
.rota{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:140px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 8px;border-top:1px solid var(--line);font-size:13.5px;border-radius:8px}
.rrow:first-child{border-top:0}
.rrow.me{background:var(--gold-soft)}
.rrow.now .rg{color:var(--brand-ink)}
.rd{color:var(--muted);font-size:12.5px}
.rst{display:flex;gap:4px}
.rs{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.rs.ok{background:var(--good-soft);color:var(--good)} .rs.wait{background:var(--warn-soft);color:var(--warn)} .rs.todo{border:2px dashed var(--line)}
@media (max-width:560px){.rrow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}.rrow .rd,.rrow .rdeco{grid-column:1/-1}}

/* activités */
.act{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface)}
.card>.act{border:0;padding:0}
.act h3{font-size:16px;font-weight:800;margin-top:10px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.acts{grid-template-columns:minmax(0,1fr)}}
.kv3{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin-top:10px}
.kv3 b{color:var(--ink);font-size:15px;margin-right:4px}
.kv3.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv3.big span,.card .kv3 span{display:flex;flex-direction:column;font-size:12px;line-height:1.3}
.kv3.big b{font-size:24px;font-weight:800;margin:0 0 2px}
.act .kv3 span{flex-direction:row;font-size:13px;align-items:baseline}

/* pasteur */
.segtabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;align-self:flex-start;max-width:100%;overflow-x:auto;scrollbar-width:none}
.segtabs::-webkit-scrollbar{display:none}
.segtabs button{flex:none;white-space:nowrap;border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13.5px;color:var(--ink-2)}
@media (max-width:420px){.segtabs{gap:2px}.segtabs button{padding:8px 10px;font-size:13px}}
.segtabs button[aria-selected="true"]{background:var(--hdr);color:#fff}
.brow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow b{display:block;font-size:13.5px}
.brow small{display:block;font-size:12px;color:var(--muted)}
.podium{padding:12px 0;border-top:1px solid var(--line)}
.podium:first-of-type{border-top:0;padding-top:0}
.podium small{font-size:12px}
.prow2{display:grid;grid-template-columns:22px minmax(0,110px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.prow2 .rk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--surface-2);color:var(--ink-2)}
.prow2.first .rk{background:var(--gold);color:#1d1a08}
.prow2 .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow2 .t{height:8px;border-radius:0 4px 4px 0;background:var(--surface-2);overflow:hidden}
.prow2 .t i{display:block;height:100%;background:var(--chart);border-radius:0 4px 4px 0}
.prow2 .vl{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.prix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:10px}
@media (max-width:620px){.prix{grid-template-columns:minmax(0,1fr)}}
.prix .eyebrow{display:flex;gap:6px;align-items:center;color:var(--gold-ink)}
.prix .rk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--surface-2);flex:none}
.prix .li:nth-child(2) .rk{background:var(--gold);color:#1d1a08}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
table.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:0 8px 8px}
table.tbl td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}
table.tbl .r{text-align:right;white-space:nowrap}
table.tbl .plain b{font-size:14px}
table.tbl tr:hover td{background:var(--surface-2)}
table.mx{border-collapse:separate;border-spacing:3px;width:100%;font-size:13.5px}
table.mx th{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;padding:4px}

async function reduire(fichier, max, qualite) {
  const url = URL.createObjectURL(fichier);

    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);

async function connexion(code, rester) {
  A.occupe = true; rendre(A.verif ? "" : undefined);
  const r = await api("connexion", { code, rester, appareil: stock.lire("m360-appareil"), lang: LANG });
  A.occupe = false;
  if (!r.ok) { rendre(erreur(r)); return; }
  if (r.verification) { A.verif = { defi: r.defi, courriel: r.courriel, code, rester }; rendre(); $("#otp")?.focus(); return; }
  await ouvrirSession(r, rester);
}
async function verifier(otp) {
  A.occupe = true; rendre();
  const r = await api("verifier", { defi: A.verif.defi, otp, rester: A.verif.rester });
  A.occupe = false;
  if (!r.ok) { if (r.erreur === "otp_expire") A.verif = null; rendre(erreur(r)); return; }
  const rester = A.verif.rester; A.verif = null;
  await ouvrirSession(r, rester);
}
async function ouvrirSession(r, rester) {
  A.jeton = r.jeton; A.moi = r.moi;
  if (r.appareil) stock.ecrire("m360-appareil", r.appareil);   // cet appareil est reconnu 30 jours
  stock.ecrire("m360-jeton", rester ? r.jeton : null); stock.ecrire("m360-jeton", rester ? null : r.jeton, true);
  await charger();
}
function deconnexion(msg) {
  stock.ecrire("m360-jeton", null); stock.ecrire("m360-jeton", null, true);
  Object.assign(A, { jeton: null, moi: null, e: null, vue: null, sheet: null });
  fermer(); rendre(msg);
}
async function charger() {
  const r = await api("etat", { jeton: A.jeton });
  if (!r.ok) { if (r.erreur === "session" || r.erreur === "interdit") deconnexion(erreur(r)); else toast(erreur(r)); return; }
  A.e = r; A.moi = r.moi; A.recep = null; indexer();
  rendre(); if (A.sheet) ouvrir(A.sheet, true);
}
// Une action : l'API répond avec la fiche mise à jour, ou avec tout l'état
async function action(nom, donnees, ok) {
  const r = await api(nom, { jeton: A.jeton, ...donnees });
  if (!r.ok) { if (r.erreur === "session") deconnexion(erreur(r)); else toast(erreur(r)); return false; }
  if (r.nouveau) { const i = A.e.nouveaux.findIndex((n) => n.id === r.nouveau.id); if (i >= 0) A.e.nouveaux[i] = r.nouveau; else A.e.nouveaux.push(r.nouveau); }
  if (r.dimanche) { A.e = r; A.recep = null; indexer(); }
  rendre(); if (A.sheet) ouvrir(A.sheet, true);
  if (ok) toast(tr(ok));
  return true;
}

const VUES = {};
VUES.mesnouveaux = () => {
  const u = A.moi, mine = A.e.nouveaux.filter((n) => n.referent === u.id), cur = mine.filter((n) => n.dimanche === A.e.dimanche);
  const afaire = mine.filter((n) => alertesN(n).length);
  const appels = mine.filter((n) => n.intention !== "visite" && !appelFait(n) && new Date() < echeanceAppel(n)).length, mercis = mine.filter((n) => !n.merci).length;
  return `<div class="narrow stack">
    <div class="hello"><h1>${tr("Bonjour {0}", esc(u.prenom))}</h1><p>${tr("Amis des Nouveaux · référent de {0} ces 8 dernières semaines", pl(mine.length, "nouveau", "nouveaux"))}</p></div>
    <section class="card report-hero"><span class="eyebrow">${tr("Cette semaine")}</span><h2>${appels ? tr("{0} à faire avant mercredi, 21 h", pl(appels, "appel")) : tr("Aucun appel en attente")}</h2>
      <div class="meta"><span>${tr("Remerciement : le dimanche même · appel : avant mercredi 21 h")}</span><span>${mercis ? tr("{0} à envoyer", pl(mercis, "remerciement")) : tr("Remerciements à jour")}</span></div></section>
    <section class="card"><div class="card-hd"><h2>${tr("À faire")}</h2><span class="pill ${afaire.length ? "p-warn" : "p-good"} num">${afaire.length}</span></div><div class="list">${afaire.map((n) => ligneNouveau(n)).join("") || `<div class="empty">${tr("Rien en attente. Merci !")}</div>`}</div></section>
    <section class="card"><div class="card-hd"><h2>${tr("Mes nouveaux de dimanche")}</h2><span class="muted" style="font-size:12.5px">${long(d8(A.e.dimanche))}</span></div><div class="list">${cur.map((n) => ligneNouveau(n, false)).join("") || `<div class="empty">${tr("Personne pour l'instant.")}</div>`}</div></section>
    <section class="card"><h2>${tr("Mes nouveaux précédents")}</h2><div class="list" style="margin-top:4px">${mine.filter((n) => n.dimanche !== A.e.dimanche).sort((a, b) => (a.dimanche < b.dimanche ? 1 : -1)).map((n) => ligneNouveau(n, false)).join("") || `<div class="empty">${tr("Aucun.")}</div>`}</div></section>
  </div>`;

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-a]");
  if (!b || b.tagName === "INPUT") return;
  const a = b.dataset.a, v = b.dataset.v, sh = A.sheet;
  switch (a) {
    case "langue": choisirLangue(v); rendre(); if (A.sheet) ouvrir(A.sheet, true); break;
    case "renvoyer": if (A.verif) { await connexion(A.verif.code, A.verif.rester); if (A.verif) toast(tr("Nouveau code envoyé")); } break;
    case "retour-code": A.verif = null; rendre(); break;
    case "vue": if (v === "pyramide") animPyr = true; A.vue = v; fermer(); rendre(); scrollTo(0, 0); break;
    case "dimT": A.dimT = v; rendre(); break;
    case "actualiser": await charger(); toast(tr("À jour")); break;
    case "sortir": deconnexion(); break;
    case "fermer": fermer(); break;
    case "suivi": ouvrir({ id: v, b: { res: null, cercleOk: null, ressenti: null, intention: null, questions: "" } }); break;
    case "referent": await action("referent", { id: v }, "Vous êtes son référent"); break;
    case "arrivee": await action("arrivee", { invitation: v, venu: b.dataset.x === "1" }); break;
    case "basculer": await action("basculer", { id: v, champ: b.dataset.k, valeur: b.dataset.x === "1" }); break;
    case "merci": await action("merci", { id: v }, "Remerciement noté"); break;
    case "ap-res": sh.b.res = v; ouvrir(sh, true); break;
    case "ap-cercle": sh.b.cercleOk = v; ouvrir(sh, true); break;
    case "ap-res2": sh.b.ressenti = v; ouvrir(sh, true); break;
    case "ap-int": sh.b.intention = v; ouvrir(sh, true); break;
    case "appel": {
      const bb = sh.b;
      if (await action("appel", { id: v, resultat: bb.res, cercleContact: bb.cercleOk, ressenti: bb.ressenti, intention: bb.intention, questions: bb.questions }, bb.res === "pas_reponse" ? "Essai noté : à rappeler" : "Appel noté")) {
        sh.b = { res: null, cercleOk: null, ressenti: null, intention: null, questions: "" }; if (A.sheet) ouvrir(A.sheet, true);
      }
      break;
    }
    case "confier": {
      const g = sh.choix || $(`[data-grp="${v}"]`)?.value;
      if (!g) { toast(tr("Choisissez d'abord un groupe")); break; }
      await action("confier", { id: v, groupe: g }, "Confié : le groupe est prévenu");

function dessinPyramide(c, total, sel, anim) {
  const rows = [["reproduction"], ["objectif"], ["permission"], ["position"], ["potentiel"], ["actif"], ["regulier"], ["irregulier", "deserteur"], ["nouveau"]];

      if (A.sheet === sh) fermer();
      await charger();
      toast(sh.photos.length ? tr("Activité enregistrée, {0} dans Drive.", pl(n, "photo")) : tr("Activité enregistrée")); break;
    }
    case "ajouter": { const g = monGem(); if (g) ouvrir({ type: "ajouter", gem: g.id }); break; }
    // famille d'honneur
    case "renc-prochaine": await action("rencontre", { prochaine: A.renc.prochaine }, "Prochaine rencontre enregistrée"); break;
    case "renc-enreg": A.occupe = true; rendre(); await action("rencontre", { date: A.renc.date, presents: A.renc.presents }, "Présence enregistrée"); A.occupe = false; rendre(); break;
    // pasteur et assistants pasteurs
    case "prendre": await action("prendre", { cle: v, pid: b.dataset.p, semaine: b.dataset.s }, "Noté : vous vous en occupez"); break;
    case "confier-ap": ouvrir({ type: "confier", cle: v, pid: b.dataset.p, sem: b.dataset.s }); break;
    case "confier-a": if (await action("confier_ap", { cle: v, pid: b.dataset.p, semaine: b.dataset.s, ap: b.dataset.x }, "Confié à l'assistant pasteur")) fermer(); break;
    case "clore": await action("clore_suivi", { cle: v }, "Suivi terminé"); break;
    case "noter": await action("noter", { id: v, n: +b.dataset.n }, "Décoration notée"); break;
    case "rot-ouvrir": A.rotOuvert = true; A.rot = null; rendre(); break;
    case "rot-fermer": A.rotOuvert = false; rendre(); break;
    case "rot-gem": basculerListe((A.rot = A.rot || { debut: decal(D.COUR, 7), ordre: [] }).ordre, v); rendre(); break;
    case "sseg": A.sseg = v; rendre(); break;
    case "aller-rec": A.sseg = "recensement"; A.vue = "structure"; rendre(); scrollTo(0, 0); break;
    case "integrer": await integrer(v === "*" ? D.recensement.lignes.filter((r) => r.statut !== "intégré").map((r) => r.id) : [v]); break;
    case "ecarter": await action("ecarter", { id: v }, "Réponse écartée"); break;
    case "resp-ok": await action("responsabilite", { id: v, ok: true }, "Responsabilité confirmée"); break;
    case "resp-non": await action("responsabilite", { id: v, ok: false }, "Responsabilité refusée"); break;
    case "copier-lien": navigator.clipboard?.writeText(v).then(() => toast(tr("Lien copié")), () => toast(v)); break;
    case "rot-planifier": A.occupe = true; rendre(); if (await action("rotation", { debut: A.rot.debut, ordre: A.rot.ordre }, "Rotation planifiée")) { A.rotOuvert = false; A.rot = null; } A.occupe = false; rendre(); break;
  }
});
document.addEventListener("input", (e) => {
  const t = e.target, sh = A.sheet;
  if (sh?.type === "activite" && t.dataset.f) { const bb = sh.b, btn = $('[data-a="enreg-activite"]'); if (btn) btn.disabled = !(bb.type && bb.titre.trim() && bb.date); }
  if (t.dataset.moi && D) { const k = `${t.dataset.moi}|${A.moi.id}`; D.meteo[k] = { ...(D.meteo[k] || { v: null }), mot: t.value }; pousserMeteo(t.dataset.moi); }
  if (t.dataset.rc && A.renc) A.renc[t.dataset.rc] = t.value;
  if (t.id === "a-cp" && D) {
    const z = zoneDuCP(t.value), el = $("#a-zone"), c = z && cerclesDe(A.sheet?.gem).find((x) => x.zone === z);
    if (el) el.textContent = z ? `${tr("Zone {0}", zoneNom(z))}${c ? ` · ${tr("cercle proposé : {0}", c.nom)}` : ""}` : tr("La zone et le cercle le plus proche se déduisent des trois premiers caractères.");
    if (c) $("#a-cercle").value = c.id;
  }
});
document.addEventListener("change", async (e) => {
  const t = e.target, sh = A.sheet;
  if (t.dataset.a === "atteste" && sh) { sh.b.atteste = t.checked; ouvrir(sh, true); }
  if (t.dataset.photos && sh) {
    sh.prep = true; ouvrir(sh, true);
    for (const f of [...t.files].slice(0, 20)) { try { sh.photos.push({ full: await reduire(f, 1600, 0.82), vign: await reduire(f, 360, 0.7) }); } catch (err) { toast(tr("Une photo n'a pas pu être lue.")); } }
    sh.prep = false; if (A.sheet === sh) ouvrir(sh, true);
  }
  if (t.dataset.rp && A.renc) { basculerListe(A.renc.presents, t.dataset.rp); rendre(); }
  if (t.dataset.rc === "date" && A.renc && D) { const r = D.rencontres.find((x) => x.date === t.value && x.famille === A.renc.famille); A.renc.presents = r ? [...r.presents] : []; rendre(); }
  if (t.dataset.rot && A.rot) { A.rot.debut = t.value; rendre(); }
  if (t.dataset.dep) await action("deplacer", { pid: t.dataset.dep, cercle: t.value }, "Cercle mis à jour");
  if (t.dataset.pal) await action("palier", { pid: t.dataset.pal, palier: t.value }, "Palier mis à jour");
});
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "form-ajout") return;
  e.preventDefault();
  const d = { gem: A.sheet.gem, prenom: $("#a-prenom").value.trim(), nom: $("#a-nom").value.trim(), tel: $("#a-tel").value.trim(), cp: $("#a-cp").value.trim(), cercle: $("#a-cercle").value };
  if (!d.prenom || !d.nom) return;
  A.occupe = true; ouvrir(A.sheet, true);
  const ok = await action("ajouter_membre", d, "Membre ajouté");
  A.occupe = false;
  if (ok) fermer(); else if (A.sheet) ouvrir(A.sheet, true);
});
// Infobulles des graphiques
document.addEventListener("pointerover", (e) => { const t = e.target.closest?.("[data-tip]"), tip = $("#tip"); if (!t || !tip) return; tip.textContent = t.dataset.tip; tip.hidden = false; });
document.addEventListener("pointermove", (e) => { const tip = $("#tip"); if (tip && !tip.hidden) { tip.style.left = Math.max(90, Math.min(innerWidth - 90, e.clientX)) + "px"; tip.style.top = e.clientY + "px"; } });
document.addEventListener("pointerout", (e) => { const tip = $("#tip"); if (tip && e.target.closest?.("[data-tip]")) tip.hidden = true; });
// Après chaque rendu : les vignettes de photos à charger
function apresRendu() {
  if (!$("#tip")) { const t = document.createElement("div"); t.id = "tip"; t.className = "tip"; t.hidden = true; document.body.appendChild(t); }
  if (D && document.querySelector("[data-ph]")) chargerPhotos();
}

/* M360 Formation · guidage du bac à sable (chargé APRÈS l'application).
   La page de formation envoie { type: "m360-guide", role, vue, etat, cible, clic } : le bac à sable change d'espace,
   ouvre l'écran voulu et entoure d'un anneau doré l'élément à toucher. L'anneau suit l'écran à chaque nouveau rendu. */
(() => {
  const st = document.createElement("style");
  st.textContent = `.guide-cible{position:relative;z-index:2;outline:3px solid #D2AF1F!important;outline-offset:3px;border-radius:12px;box-shadow:0 0 0 8px rgba(210,175,31,.22)!important}
    @media (prefers-reduced-motion:no-preference){.guide-cible{animation:guidePulse 1.6s ease-in-out infinite}@keyframes guidePulse{50%{box-shadow:0 0 0 14px rgba(210,175,31,.08)!important}}}
    .bac-bandeau{position:sticky;top:0;z-index:30;background:#D2AF1F;color:#1d1a08;font:700 11.5px/1.3 Montserrat,Arial,sans-serif;text-align:center;padding:5px 10px;letter-spacing:.02em}`;
  document.head.appendChild(st);
  const bandeau = document.createElement("div");
  bandeau.className = "bac-bandeau";
  bandeau.textContent = PARAMS_BAC.get("lang") === "en" ? "Practice · fictitious data, nothing is saved" : "Entraînement · données fictives, rien n'est enregistré";
  document.body.prepend(bandeau);
  let CIBLE = PARAMS_BAC.get("cible") || null, vu = false;
  function marquer() {
    document.querySelectorAll(".guide-cible").forEach((e) => e.classList.remove("guide-cible"));
    if (!CIBLE) return;
    const el = [...document.querySelectorAll(CIBLE)].find((x) => x.offsetParent !== null);
    if (!el) return;
    el.classList.add("guide-cible");
    if (!vu) { vu = true; el.scrollIntoView({ block: "center", behavior: "smooth" }); }
  }
  let attente = 0;
  new MutationObserver(() => { cancelAnimationFrame(attente); attente = requestAnimationFrame(marquer); }).observe(document.body, { childList: true, subtree: true });
  let ATTENDU = null;   // un geste attendu par l'exercice (sélecteur) : il est signalé à la page de formation
  document.addEventListener("click", (e) => {
    if (ATTENDU && e.target.closest?.(ATTENDU)) { try { parent.postMessage({ source: "m360-bac", ui: ATTENDU }, location.origin); } catch (err) { /* seule */ } }
  }, true);
  async function aller(d) {
    if (d.attendre) ATTENDU = d.attendre;
    if (d.role && d.role !== "connexion" && d.role !== roleBac) { roleBac = d.role; A.jeton = "bac-" + d.role; A.vue = null; A.e = null; A.sheet = null; fermer(); await charger(); }
    if (d.etat) Object.assign(A, d.etat);
    if (d.vue) { A.vue = d.vue; fermer(); rendre(); scrollTo(0, 0); }
    if ("cible" in d || d.vue) { CIBLE = d.cible || null; vu = false; }
    marquer();
    if (d.clic) setTimeout(() => document.querySelector(d.clic)?.click(), 60);
  }
  addEventListener("message", (e) => { if (e.origin === location.origin && e.data && e.data.type === "m360-guide") aller(e.data); });
  // Écran de départ choisi par l'adresse (?vue=…&cible=…), une fois l'état chargé
  const depart = { vue: PARAMS_BAC.get("vue"), cible: CIBLE, etat: PARAMS_BAC.get("etat") ? JSON.parse(PARAMS_BAC.get("etat")) : null };
  const t0 = setInterval(() => { if (A.e || !A.jeton) { clearInterval(t0); if (A.e) aller(depart); try { parent.postMessage({ source: "m360-bac", pret: true }, location.origin); } catch (e) { /* seule */ } } }, 60);
})();

</script>
